<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albion Caerleon Smuggler & Bandit Watch | Calculadora Black Market</title>
    <meta name="description" content="Rastreador de Assalto dos Bandidos em Albion Online e Calculadora de Arbitragem em Tempo Real entre Lymhurst e o Mercado Negro de Caerleon." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Principais -->
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- Cabeçalho Principal -->
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-section">
          <div class="brand-icon-shield">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div class="brand-titles">
            <h1>
              Albion Smuggler
              <span class="brand-tag">Lymhurst Command</span>
            </h1>
            <p class="brand-sub">Rastreador do Assalto dos Bandidos & Calculadora de Arbitragem Caerleon</p>
          </div>
        </div>

        <div class="header-meta-controls">
          <!-- Seletor de Servidor Oficial -->
          <div class="server-selector-box">
            <span class="server-label">Servidor:</span>
            <select id="header-server-select" class="server-select">
              <option value="americas">Americas (West)</option>
              <option value="europe">Europe</option>
              <option value="asia">Asia (East)</option>
            </select>
          </div>

          <!-- Relógio Albion (UTC) & Local (BRT) -->
          <div class="clocks-display">
            <div class="clock-item">
              <span class="clock-tag">ALBION (UTC):</span>
              <span class="clock-val" id="clock-utc">00:00:00</span>
            </div>
            <div class="clock-item">
              <span class="clock-tag">LOCAL:</span>
              <span class="clock-val" id="clock-local">00:00:00</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-container">
      <!-- Abas de Navegação -->
      <nav class="tabs-navigation" aria-label="Abas de Navegação">
        <button class="tab-btn active" data-tab="bandit" id="tab-btn-bandit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Assalto dos Bandidos & Rota
        </button>
        <button class="tab-btn" data-tab="calculator" id="tab-btn-calculator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
          Calculadora Black Market
        </button>
        <button class="tab-btn" data-tab="cart" id="tab-btn-cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          Carrinho de Transporte
          <span class="tab-badge" id="cart-badge-count">0</span>
        </button>
        <button class="tab-btn" data-tab="guide" id="tab-btn-guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Guia Albion Data Client
        </button>
      </nav>

      <!-- Painel Dinâmico da Aba Ativa -->
      <section id="app-view-container" aria-live="polite">
        <!-- Renderizado dinamicamente por src/main.js -->
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
